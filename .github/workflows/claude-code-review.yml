name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Diagnose Claude review failure
        if: ${{ failure() && steps.claude-review.outcome == 'failure' }}
        run: |
          # Report failure categories without publishing model messages or tool output.
          jq '[.[] | select(.type == "result") | {
            subtype,
            is_error,
            http_status: ((.result // "" | capture("(?i)(?:api error|http)[: ]+(?<code>[0-9]{3})") | .code) // null),
            authentication_error: (.result // "" | test("(?i)authenticate|authentication|oauth|token.*(?:invalid|expired)")),
            rate_limited: (.result // "" | test("(?i)rate.?limit|usage.?limit|credit balance")),
            model_unavailable: (.result // "" | test("(?i)model.*(?:not found|unavailable|does not exist)"))
          }]' "$RUNNER_TEMP/claude-execution-output.json"
